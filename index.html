<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="all">
        <div class="calc-frame">
            <div class="calc-display">
                <div class="holder"></div>
                <div class="current"></div>
            </div>
                
            <div class="calc-nums">
                <button type="button" class="num nine" id="9">9</button>
                <button type="button" class="num eight" id="8">8</button>
                <button type="button" class="num seven" id="7">7</button>
                <button type="button" class="num  six" id="6">6</button>
                <button type="button" class="num five" id="5">5</button>
                <button type="button" class="num four" id="4">4</button>
                <button type="button" class="num three" id="3">3</button>
                <button type="button" class="num two" id="2">2</button>
                <button type="button" class="num one" id="1">1</button>
                <button type="button" class="num zero" id="0">0</button>
            </div>

            <div class="calc-actions">
                <button type="button" class="action clr">C</button>
                <button type="button" class="action add">+</button>
                <button type="button" class="action sub">-</button>
                <button type="button" class="action mul">*</button>
                <button type="button" class="action divide">/</button>
                <button type="button" class="action float">.</button>
                <button type="button" class="action equal">=</button>
            </div>
        </div>
    </div>

</body>

</html>
